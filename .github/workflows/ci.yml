name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run security and quality checks
        run: pre-commit run --all-files

      - name: Install rclone (for tool tests)
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Run tool tests
        run: python3 -m unittest discover -s tools/rclone/tests -v

      - name: Check for pii:allow exceptions
        run: |
          if grep -rn "pii:allow" --include='*.md' --include='*.yaml' --include='*.py' .; then
            echo "::warning::Found pii:allow exceptions — review these for legitimacy"
          fi
