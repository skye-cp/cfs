# SKai pre-commit baseline — reference: apply-repo-standards § Pre-commit baseline.
# Install once per clone:  pre-commit install   (arms pre-commit, commit-msg, pre-push)
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # -- General hygiene --
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: mixed-line-ending
      - id: check-case-conflict
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  # -- Repo guards --
  - repo: local
    hooks:
      - id: main-via-merge-only
        name: Block direct commits to main (branch, then merge)
        language: system
        entry: sh -c 'test "$(git branch --show-current)" != main || test -f "$(git rev-parse --git-dir)/MERGE_HEAD" || git diff --cached --quiet || { echo "main takes merges only - commit on a branch, then git merge --no-ff"; exit 1; }'
        pass_filenames: false
        always_run: true
      - id: block-env-files
        name: Block .env files (.env.example is fine)
        language: fail
        entry: .env files hold secrets and are never committed
        files: '(^|/)\.env(\.[^/]*)?$'
        exclude: '(^|/)\.env\.example$'

  # -- Secrets detection --
  # detect-secrets — incumbent. Kept for the .secrets.baseline allowlist
  # workflow. Detection breadth has been overtaken; gitleaks below carries
  # the primary load.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.config/secrets.baseline']
        exclude: ^\.config/secrets\.baseline$

  # gitleaks — primary secrets engine. Broader detector set, composite
  # rules for proximity-keyed PII identifiers (used later for BR/IT/JP
  # region coverage). Fully offline, MIT-licensed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: [-c, .config/gitleaks.toml, -i, .config/gitleaksignore]
  - repo: local
    hooks:
      - id: gitleaks-push
        name: Scan pushed commits for secrets
        language: system
        entry: sh -c 'gitleaks git --no-banner --redact -c .config/gitleaks.toml -i .config/gitleaksignore --log-opts="${PRE_COMMIT_TO_REF:-HEAD} --not --remotes"'
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  # -- PII detection (structured patterns) --
  - repo: local
    hooks:
      - id: check-pii
        name: Check for PII patterns
        entry: python3 dev/check_pii.py
        language: system
        types: [text]
        exclude: '\.svg$'

  # -- PII reminder (manual review) --
  # Structured PII checker only catches patterns. Contextual PII — real
  # names, region-specific company names, geographic indicators, account
  # paths — must be caught by reading the diff. This hook prints a
  # reminder to do so on every commit.
  - repo: local
    hooks:
      - id: pii-reminder
        name: PII reminder (manual review needed)
        entry: bash dev/pii_reminder.sh
        language: system
        always_run: true
        pass_filenames: false
        verbose: true

  # -- Python linting/formatting --
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.11
    hooks:
      - id: ruff
        args: ['--fix', '--extend-select=S']
      - id: ruff-format

  # -- Shell --
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # -- GitHub workflows --
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        language_version: python3.12

  # -- Commit message convention --
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ['feat', 'fix', 'docs', 'refactor', 'test', 'chore', 'ci']
